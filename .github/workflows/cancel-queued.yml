name: Cancel All Queued Runs

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cancel-queued:
    runs-on: ubuntu-latest

    steps:
      - name: Cancel queued workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                status: "queued",
                per_page: 100
              }
            );

            const targets = runs.filter(
              run => run.id !== context.runId
            );

            console.log(`Found ${targets.length} queued runs.`);

            for (const run of targets) {
              try {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });

                console.log(`Cancellation requested: #${run.run_number}`);
              } catch (error) {
                console.log(
                  `Could not cancel #${run.run_number}: ${error.message}`
                );
              }
            }

            console.log("Finished processing queued runs.");
